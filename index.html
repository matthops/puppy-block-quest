<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="A math adventure game made by two brothers. Walk, jump, and solve math to get your puppy home.">
<meta name="theme-color" content="#16213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puppy Quest">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Puppy Block Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: arcade-cabinet frame. Bright block-world stage(s) on top, chunky controls + math panel below. Versus = two cabinets side by side. Single deliberate look. */
:root{
  --frame:#16213e; --frame-2:#0e1630; --edge:#2a3866; --ink:#1d2742; --paper:#fbfcff;
  --pup:#ff8a1f; --pup-dark:#c85f0a; --pup-soft:#ffe7cc;
  --l1:#1fae6a; --l2:#7552f0; --p2:#1f8fe0;
  --muted:#5b6788; --bad:#e2485c; --good:#1fae6a; --gold:#ffc83d;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--frame);color:#eef2ff;font-family:var(--body);font-size:17px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.6rem);color:var(--pup);letter-spacing:.01em;text-shadow:3px 3px 0 var(--frame-2),5px 5px 0 #000}
.hdr-r{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{background:var(--frame-2);border:2px solid var(--edge);color:#eef2ff;border-radius:10px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.worlds{display:grid;gap:18px;grid-template-columns:minmax(0,min(980px,max(460px,calc((100dvh - 330px) * 2.2857))));justify-content:center}
.worlds.vs{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.worlds.vs{grid-template-columns:minmax(0,1fr)}}
.world{display:flex;flex-direction:column;gap:10px;min-width:0}
.whud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--frame-2);border:2px solid var(--edge);border-radius:10px;padding:5px 11px;font-weight:600;font-variant-numeric:tabular-nums}
.tag{font-family:var(--display);font-size:1.2rem;padding:4px 12px;border-radius:10px;color:#fff}
.prog{flex:1 1 140px;min-width:120px;height:14px;background:var(--frame-2);border:2px solid var(--edge);border-radius:8px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--pup);width:0}
.prog span{position:absolute;right:-6px;top:-10px;font-size:18px}
.stagebox{position:relative;border:6px solid var(--frame-2);border-radius:16px;overflow:hidden;background:#8fd3ff;box-shadow:0 8px 0 #0a1024}
canvas{display:block;width:100%;height:auto;max-width:100%;image-rendering:pixelated}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(255,255,255,.95);color:var(--ink);font-family:var(--display);font-size:clamp(.9rem,2.4vw,1.3rem);padding:6px 14px;border-radius:12px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);max-width:88%;text-align:center;transition:opacity .25s;pointer-events:none}
.banner.off{opacity:0}
.ctrls{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;user-select:none;-webkit-user-select:none}
.ctrls .pad{display:flex;gap:10px}
.cbtn{pointer-events:auto;opacity:.85;touch-action:none;min-width:clamp(58px,8vw,84px);height:clamp(52px,7.5vw,68px);border-radius:16px;border:3px solid #0a1024;border-bottom-width:8px;background:#2a3866;color:#fff;font-family:var(--display);font-size:1.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cbtn small{font-family:var(--body);font-size:.72rem;font-weight:600;opacity:.75;margin-top:3px}
.cbtn.jump{background:var(--pup);min-width:clamp(90px,12vw,130px)}
.cbtn.on{transform:translateY(3px);border-bottom-width:5px;filter:brightness(1.15)}
.panel{background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;border:4px solid var(--frame-2);box-shadow:0 6px 0 #0a1024;min-height:170px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.35rem,3.4vw,1.85rem);text-wrap:balance}
.panel p{margin:0;line-height:1.45}
.turn{align-self:flex-start;font-family:var(--display);font-size:1.2rem;padding:6px 14px;border-radius:12px;color:#fff}
.turn.l1{background:var(--l1)} .turn.l2{background:var(--l2)}
.probrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.problem{font-family:var(--display);font-size:clamp(2.2rem,7vw,3.4rem);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.speak{font-size:1.5rem;background:var(--pup-soft);border:3px solid var(--pup);border-radius:12px;padding:4px 12px;cursor:pointer}
.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.vs .answers{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.answers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ans{position:relative;font-family:var(--display);font-size:clamp(1.7rem,5vw,2.3rem);padding:12px 0;border-radius:14px;border:3px solid var(--ink);border-bottom-width:8px;background:var(--pup-soft);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.ans kbd{position:absolute;left:8px;top:6px;font-family:var(--body);font-size:.75rem;font-weight:600;color:var(--muted);border:1.5px solid var(--muted);border-radius:5px;padding:0 5px}
.ans:active:not(:disabled){transform:translateY(3px);border-bottom-width:5px}
.ans.wrong{background:#f1f2f6;color:#a7adbf;border-color:#c5cad8;text-decoration:line-through;animation:shake .35s}
.ans.right{background:var(--good);color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.feedback{min-height:1.4em;font-weight:600;font-size:1.08rem}
.feedback.bad{color:var(--bad)} .feedback.good{color:var(--good)}
.hintbtn{align-self:flex-start;background:#fff6d6;border:3px solid var(--gold);color:var(--ink);border-radius:12px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.hintbtn.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,200,61,.4)}}
.hint{background:#fff9e6;border:2px dashed var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.dots{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{width:18px;height:18px;border-radius:4px;background:var(--pup);border:2px solid var(--pup-dark)}
.dot.b{background:#27b6c9;border-color:#16808f}
.dot.x{background:#eee;border-color:#bbb;position:relative}
.dot.x::after{content:"";position:absolute;inset:-3px;background:linear-gradient(45deg,transparent 44%,var(--bad) 44% 56%,transparent 56%)}
.grid{display:inline-grid;gap:3px}
.grid .dot{width:12px;height:12px;border-width:1px;border-radius:3px}
.plus{font-family:var(--display);font-size:1.5rem;padding-inline:4px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.act{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:14px;border:3px solid var(--ink);border-bottom-width:8px;background:var(--pup-soft);color:var(--ink);cursor:pointer;font:inherit}
.act b{font-family:var(--display);font-weight:400;font-size:1.45rem}
.act:disabled{opacity:.55;cursor:not-allowed}
.act.sword{background:#e6ecff}
.big{font-family:var(--display);font-size:1.5rem;padding:10px 24px;border-radius:14px;border:3px solid var(--ink);border-bottom-width:8px;background:var(--pup);color:#fff;cursor:pointer;text-shadow:2px 2px 0 var(--pup-dark)}
.big.alt{background:#fff;color:var(--ink);text-shadow:none;font-size:1.15rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lbl{font-weight:600;font-size:1.05rem}
.text{font:inherit;font-size:1.25rem;padding:8px 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);width:100%;max-width:340px;box-sizing:border-box}
.setup{display:grid;gap:18px;grid-template-columns:minmax(0,980px);justify-content:center}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;padding:8px 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg button.l1[aria-pressed=true]{background:var(--l1);border-color:var(--l1)}
.seg button.l2[aria-pressed=true]{background:var(--l2);border-color:var(--l2)}
.seg.big-seg button{font-family:var(--display);font-weight:400;font-size:1.3rem;padding:10px 16px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pcard{border:3px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff}
.pcard.off{opacity:.5}
.pcard .top{display:flex;gap:10px;align-items:center}
.pcard input[type=checkbox]{width:24px;height:24px;accent-color:var(--pup)}
.keys{font-size:.9rem;color:var(--muted)}
.err{color:var(--bad);font-weight:600;min-height:1.2em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{border:3px solid var(--ink);border-radius:14px;padding:10px 14px;background:#fff}
.stat .n{font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.result{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;border:4px solid var(--gold);box-shadow:0 6px 0 #0a1024;display:flex;flex-direction:column;gap:12px}
.result h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4vw,2.3rem)}
[hidden]{display:none!important}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.item{border:3px solid var(--ink);border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.item .ic{font-size:2rem;line-height:1}
.item b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.item .price{font-weight:600;font-variant-numeric:tabular-nums}
.item button{font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;border:3px solid var(--ink);border-bottom-width:6px;background:var(--gold);color:var(--ink);cursor:pointer}
.item button:disabled{background:#eceef4;color:#8a92a8;border-color:#c5cad8;cursor:not-allowed}
.item.owned{background:#eefaf3;border-color:var(--good)}
.bank{font-family:var(--display);font-size:1.6rem}
.shoptop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.shoptop canvas{width:160px;height:120px;border-radius:12px;border:3px solid var(--ink);background:#c9ecff;flex:none}
.buybox{background:#fff6d6;border:3px solid var(--gold);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.studio{display:flex;flex-direction:column;gap:10px}
.studio canvas{width:100%;max-width:480px;height:auto;aspect-ratio:384/240;touch-action:none;border:3px solid var(--ink);border-radius:12px;cursor:crosshair;image-rendering:pixelated}
.paints{display:flex;gap:8px;flex-wrap:wrap}
.paints button{font:inherit;font-weight:600;padding:7px 12px;border-radius:10px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.paints button i{width:18px;height:18px;border-radius:4px;border:2px solid var(--ink);display:inline-block}
.paints button[aria-pressed=true]{background:var(--gold);transform:translateY(-2px)}
.paints .clear{background:#fff;border-color:var(--bad);color:var(--bad)}
.wtable{border-collapse:collapse;margin-top:10px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.wtable th,.wtable td{border:2px solid var(--ink);padding:4px 14px;text-align:center}
.wtable th{background:#dbe8ff}
.story{font-size:clamp(1.2rem,3vw,1.55rem);line-height:1.5;font-weight:500;max-width:60ch;flex:1 1 300px}
.mkpal{display:flex;gap:8px;flex-wrap:wrap}
.mkpal button{font:inherit;font-weight:600;padding:8px 12px;border-radius:12px;border:3px solid var(--ink);border-bottom-width:6px;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mkpal button span{font-size:1.5rem}
.mkpal button[aria-pressed=true]{background:var(--gold);transform:translateY(-2px)}
.mkrow{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px;border:3px dashed var(--ink);border-radius:14px;background:#eef6ff;min-height:64px}
.mkrow button{flex:none;width:48px;height:48px;font-size:1.6rem;border-radius:10px;border:2px solid var(--ink);background:#fff;cursor:pointer}
.mkrow button:hover{background:#ffe3e6}
.mkend{flex:none;font-size:1.8rem}
.wsel{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;background:#fff}
.wsel select{font:inherit;font-weight:600;border:0;background:transparent;color:var(--ink);padding:5px 2px;cursor:pointer}
.mylv{border:3px dashed var(--gold);border-radius:14px;padding:12px;background:#fffbea;display:flex;flex-direction:column;gap:10px}
.mylist{display:flex;gap:10px;flex-wrap:wrap}
.mycard{display:flex;align-items:stretch}
.myplay{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:inherit;padding:8px 14px;border:3px solid var(--ink);border-right:0;border-radius:12px 0 0 12px;background:#fff;color:var(--ink);cursor:pointer;min-width:120px;text-align:left}
.myplay span{font-size:1.4rem}.myplay b{font-family:var(--display);font-weight:400;font-size:1.15rem}.myplay small{color:var(--good);font-weight:600}
.myedit{font-size:1.1rem;border:3px solid var(--ink);border-radius:0 12px 12px 0;background:var(--gold);cursor:pointer;padding:0 10px}
.holdbtn{position:relative;overflow:hidden;align-self:flex-start;min-width:260px;touch-action:none;user-select:none}
.holdbtn span{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--good);opacity:.6}
.holdbtn i{position:relative;font-style:normal}
.kid{border:3px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;background:#fff}
.chartbox{display:flex;flex-direction:column;gap:6px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding:6px 4px 0;border-bottom:2px solid #c5cad8}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bcol .bar{width:100%;max-width:42px;background:var(--pup);border-radius:4px 4px 0 0}
.bcol .bv{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s}
.bcol:hover .bv,.bcol:last-child .bv{opacity:1}
.bcol .bl{font-size:.75rem;color:var(--muted);margin-bottom:-22px;height:18px}
.chartbox{padding-bottom:20px}
.track{display:flex;flex-direction:column;gap:8px}
.ladder{display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.rung{display:grid;grid-template-columns:28px minmax(160px,1.6fr) minmax(80px,1fr) 44px 86px 64px;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-variant-numeric:tabular-nums;font-size:.95rem}
.rung.now{background:#fff3d6;outline:2px solid var(--gold)}
.rung.done .rn{color:var(--muted)}
.rb{height:10px;background:#eceef4;border-radius:5px;overflow:hidden}
.rb i{display:block;height:100%;background:var(--good);border-radius:5px}
.rt small,.rc{color:var(--muted);font-size:.8rem}
.panel,.result{color-scheme:light}
.ctl{font-size:.95rem}.ctl select{font:inherit;padding:4px 6px;border-radius:8px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.chk{display:inline-flex;gap:6px;align-items:center}
.resetbtn{font:inherit;font-size:.9rem;padding:6px 10px;border-radius:10px;border:2px solid var(--bad);background:#fff;color:var(--bad);cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip2{padding:5px 10px;border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums}
.chip2.bad{background:#ffe3e6;color:#a8202f}.chip2.good{background:#e3f7ec;color:#16784a}
.chip2 small{font-weight:400}
.log{margin:0;padding-left:18px;line-height:1.6}
.pw{display:flex;gap:6px;flex-wrap:wrap}
.pw button{font:inherit;font-size:.95rem;font-weight:600;padding:5px 10px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.pw button[aria-pressed=true]{background:var(--gold)}
h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem}
.gp-focus{outline:5px solid var(--gold)!important;outline-offset:3px;transform:translateY(-2px)}
@media (hover:none) and (pointer:coarse){.cbtn small,.ans kbd,.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Puppy Block Quest</h1>
    <div class="hdr-r">
      <button class="iconbtn" id="homeBtn" hidden>🏠 Menu</button>
      <button class="iconbtn" id="parentBtn">📊 Grown-ups</button>
      <button class="iconbtn" id="musicBtn">🎵 Music</button>
      <button class="iconbtn" id="muteBtn">🔊 Sound</button>
    </div>
  </header>
  <div id="result" class="result" hidden></div>
  <div id="app"></div>
</div>

<script>
(function(){
const B=40,PW=52,PH=44;
const TOUCH=window.matchMedia&&matchMedia('(hover:none) and (pointer:coarse)').matches;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=n=>{n=Math.floor(n);n=(n<<13)^n;return((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- storage ----------
function load(){try{return JSON.parse(localStorage.getItem('pbq-web')||'{}')}catch(e){return{}}}
function save(){try{localStorage.setItem('pbq-web',JSON.stringify(saved))}catch(e){}}
const saved=load();
if(saved.noBosses===undefined)saved.noBosses=true;

// ---------- sound ----------
let AC=null,muted=!!saved.muted;
function updMute(){$('muteBtn').textContent=muted?'🔇 Sound off':'🔊 Sound';}
updMute();
$('muteBtn').onclick=()=>{muted=!muted;updMute();saved.muted=muted;save();};
function snd(type){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seqs={ding:[[660,.08],[880,.14]],coin:[[988,.05],[1319,.1]],buzz:[[220,.12],[180,.16]],boing:[[260,.04],[420,.07]],swish:[[1000,.04],[600,.06],[300,.08]],build:[[196,.07]],win:[[523,.11],[659,.11],[784,.11],[1047,.3]],pop:[[500,.05],[250,.1]],bump:[[150,.06]],ouch:[[400,.08],[200,.14]]};
    let t=AC.currentTime;
    (seqs[type]||[]).forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='buzz'?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d;});
  }catch(e){}
}
function speak(text){
  try{
    if(!('speechSynthesis' in window))return;

const FOOT={rock:B,pit:2*B,crpit:4*B,honey:4*B,belt:4*B,slide:3*B,spit:4*B,kpit:4*B,cpit:4*B,jpit:5*B,mpit:4*B,q:B,coins:136,wall:3*B,boss:5*B};
function makeCourse(themeKey,custom,layout){
  const th=THEMES[themeKey];
  const pattern=custom&&custom.length?custom:th.pattern?th.pattern:th.crumble
    ?['rock','crpit','q','wall','coins','crpit','rock','q','boss','crpit','coins','wall','q','rock','crpit','wall','boss']
    :th.honey
    ?['rock','honey','q','wall','coins','honey','rock','q','boss','honey','coins','wall','q','rock','honey','wall','boss']
    :th.conveyor
    ?['rock','belt','q','wall','coins','belt','rock','q','boss','belt','coins','wall','q','rock','belt','wall','boss']
    :th.rainbowLand
    ?['rock','slide','q','wall','spit','coins','boss','slide','kpit','q','wall','boss','rock','spit','coins','kpit','slide','wall','boss']
    :th.cloudy
    ?['rock','cpit','q','wall','coins','cpit','rock','q','boss','cpit','coins','wall','q','rock','cpit','wall','boss']
    :th.bouncy
    ?['rock','jpit','q','wall','coins','jpit','rock','q','boss','jpit','coins','wall','q','rock','jpit','wall','boss']
    :th.moving
    ?['rock','mpit','q','wall','coins','mpit','rock','q','boss','mpit','coins','wall','q','rock','mpit','wall','boss']
    :th.pits
    ?['rock','pit','q','wall','coins','pit','rock','q','boss','pit','coins','wall','q','rock','pit','wall','boss']
    :['rock','coins','q','wall','rock','q','coins','wall','boss','rock','q','coins','wall','rock','q','wall','boss'];
  let x=520;const obs=[],coins=[],pits=[],plats=[],pads=[],bclouds=[],strips=[],kstones=[],belts=[],honeys=[],crumbs=[];let bi=0;
  const seq=layout?[...layout.items].sort((a,b)=>a.x-b.x):pattern.map(t=>({t}));
  const pat=seq.map(it=>saved.noBosses&&it.t==='boss'?'wall':it.t);
  const lastBoss=pat.lastIndexOf('boss');
  pat.forEach((type,i)=>{
    const gap=230+rnd(0,70);if(layout)x=Math.round(seq[i].x/B)*B;else x=Math.round(x/B)*B;
    if(type==='rock'){obs.push({type,x,w:B,h:B});x+=B+gap;}
    else if(type==='pit'){pits.push({x,w:2*B});x+=2*B+gap;}
    else if(type==='crpit'){pits.push({x,w:4*B});for(let k=0;k<4;k++)crumbs.push({x:x+k*B,st:'ok',t:0,oy:0});x+=4*B+gap;}
    else if(type==='honey'){honeys.push({x,w:4*B});x+=4*B+gap;}
    else if(type==='belt'){belts.push({x,w:4*B,dir:Math.random()<.5?1:-1});x+=4*B+gap;}
    else if(type==='slide'){strips.push({x,w:3*B});x+=3*B+gap;}
    else if(type==='spit'){pits.push({x,w:4*B,bridge:true,built:false});x+=4*B+gap;}
    else if(type==='kpit'){pits.push({x,w:4*B});for(let k=0;k<4;k++)kstones.push({x:x+k*B,ph:k*.25});x+=4*B+gap;}
    else if(type==='cpit'){pits.push({x,w:4*B});bclouds.push({x:x+1.25*B,w:1.5*B,sq:0});x+=4*B+gap;}
    else if(type==='jpit'){x+=B;pads.push({x:x-B,w:B,sq:0});pits.push({x,w:4*B});if(th.swim)for(let k=0;k<3;k++)coins.push({x:x+40+k*40,y:50,taken:false});x+=4*B+gap;}
    else if(type==='mpit'){pits.push({x,w:4*B});if(th.swim&&!custom)for(let k=0;k<3;k++)coins.push({x:x+40+k*40,y:50,taken:false});plats.push({x0:x,x,range:2*B,w:2*B,ph:Math.random()*6});x+=4*B+gap;}
    else if(type==='q'){obs.push({type,x,w:B,h:B,used:false,bump:0});x+=B+gap;}
    else if(type==='coins'){for(let k=0;k<4;k++)coins.push({x:x+k*34,y:-(B*1.1+Math.sin((k+.5)/4*Math.PI)*34),taken:false});x+=4*34+gap;}
    else if(type==='wall'){x+=2*B;obs.push({type,x,w:B,h:3*B,built:false});x+=B+gap;}
    else if(type==='boss'){x+=3*B;const final=i===lastBoss;const sp=th.bossList?th.bossList[bi++]:null;const hp=sp?sp.hp:th.bossHp[final?1:0];obs.push({type,x,w:2*B,h:3*B,final,hp,maxHp:hp,gone:false,escaped:false,flash:0,kind:sp&&sp.kind,name:sp&&sp.name,rainbow:sp&&sp.rainbow,colors:sp&&sp.colors});x+=2*B+gap+60;}
  });
  return {obs,coins,pits,plats,pads,bclouds,strips,kstones,belts,honeys,crumbs,finishX:layout?Math.max(layout.length,x+160):x+160};
}

// ---------- math ----------
function makeProblem(level,last){
  let p;
  for(let tries=0;tries<20;tries++){
    if(level==='l1'){
      if(Math.random()<.55){const a=rnd(1,9),b=rnd(0,Math.min(9,12-a));p={a,b,op:'+',ans:a+b};}
      else{const a=rnd(2,12),b=rnd(0,Math.min(9,a));p={a,b,op:'−',ans:a-b};}
    }else{
      if(Math.random()<.55){const a=rnd(2,10),b=rnd(2,10);p={a,b,op:'×',ans:a*b};}
      else{const b=rnd(2,10),q=rnd(2,10);p={a:b*q,b,op:'÷',ans:q};}
    }
    p.text=`${p.a} ${p.op} ${p.b} = ?`;
    if(p.text!==last)break;
  }
  const set=new Set([p.ans]);let c=[p.ans+1,p.ans-1,p.ans+2,p.ans-2];
  if(p.op==='×')c=c.concat([p.a*(p.b+1),p.a*(p.b-1),(p.a+1)*p.b,p.ans+10]);
  if(p.op==='÷')c=c.concat([p.b,p.ans+3,p.a-p.b]);
  if(p.op==='+'||p.op==='−')c=c.concat([p.ans+3,p.a,p.b]);
  shuffle(c);
  for(const v of c){if(set.size>=4)break;if(v>=0&&!set.has(v))set.add(v);}
  while(set.size<4)set.add(p.ans+set.size+2);
  p.choices=shuffle([...set]);
  return p;
}
function hintHTML(p){
  const dots=(n,cls='')=>Array.from({length:n},()=>`<i class="dot ${cls}"></i>`).join('');
  if(p.op==='+')return `<div class="dots">${dots(p.a)}<span class="plus">+</span>${dots(p.b,'b')}</div><p>Count all the squares!</p>`;
  if(p.op==='−')return `<div class="dots">${dots(p.a-p.b)}${dots(p.b,'x')}</div><p>Start with ${p.a}. Cross out ${p.b}. Count the ones that are left!</p>`;
  if(p.op==='×')return `<div class="grid" style="grid-template-columns:repeat(${p.b},12px)">${dots(p.a*p.b)}</div><p>${p.a} rows with ${p.b} in each row. Try counting by ${p.b}s!</p>`;
  const ex=[1,2,3].map(n=>`${p.b} × ${n} = ${p.b*n}`).join(' &nbsp;·&nbsp; ');
  return `<p>How many groups of ${p.b} make ${p.a}?</p><p>Think: <b>${p.b} × ? = ${p.a}</b></p><p class="muted">${ex} …</p>`;
}

const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function mast(pr,lv){pr.mastery=pr.mastery||{};pr.mastery[lv]=pr.mastery[lv]||{cur:0,lock:false,sk:{}};pr.trouble=pr.trouble||{};pr.daily=pr.daily||{};pr.log=pr.log||[];pr.stats=pr.stats||{n:0,first:0,tsum:0,tn:0};return pr.mastery[lv];}
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y);const m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2;};
function makeChoices(p){const ans=p.ans;const set=new Set([ans]);let c=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10];
  if(p.op==='×'&&!p.miss)c=c.concat([p.a*(p.b+1),p.a*(p.b-1),(p.a+1)*p.b]);if(p.op==='+'&&!p.miss)c=c.concat([Math.abs(p.a-p.b),p.a]);if(p.op==='−')c=c.concat([p.a+p.b]);
  shuffle(c);for(const v of c){if(set.size>=4)break;if(v>=0&&Number.isInteger(v)&&!set.has(v))set.add(v);}while(set.size<4)set.add(ans+set.size+3);return shuffle([...set]);}

  if(tf.length&&Math.random()<.15){const t=pick(tf);p={...t.p};si=t.si;tag='🔁 practice';}
  else{if(!M.lock){const r=Math.random();if(r>=.7&&r<.9&&M.cur>0){si=rnd(0,M.cur-1);tag='🔁 review';}else if(r>=.9&&M.cur<L.length-1){si=M.cur+1;tag='🆕 sneak peek';}}

function recordAnswer(pl,p,correct,secs){

// ---------- encounters ----------
function encounter(w,o){
  if(o.type==='bridge'){say(w,'A star bridge! ⭐');ask(w,()=>{o.pit.built=true;snd('win');for(let i=0;i<4;i++)burst(w,o.pit.x+20+i*40,w.GY,['#ffe27a','#fff','#ff9ccb'],10,160);say(w,'⭐ The star bridge appeared! Run across!');resume(w);},'There is a big gap! Answer right and a star bridge will appear.');return;}
  if(o.type==='q'){say(w,'A lucky block! 🍀');ask(w,()=>{o.used=true;luckyPrize(w,o);resume(w);},'You bonked a lucky block! Answer right for a block and a surprise prize. 🍀');}
  else if(o.type==='wall')wallTurn(w,o);
  else{say(w,`${bossName(w,o)}: "You can't get past me!"`,3200);bossTurn(w,o);}
}
function luckyPrize(w,o){
  const opts=['speed','magnet','blocks'];if(w.pits.length)opts.push('shield');
  const fresh=opts.filter(k=>!w.pw[k]||k==='blocks');
  const bx=o.x+B/2,by=w.GY-3.5*B;
  if(Math.random()<.5||!fresh.length){const n=rnd(2,5);w.coinsN+=n;snd('coin');burst(w,bx,by,['#ffc83d','#ffe27a'],10+n*2,160);say(w,`Lucky prize: +${n} coins! 🪙`);return;}
  const k=fresh[rnd(0,fresh.length-1)];
  if(k==='blocks'){w.blocks+=3;}else{w.pw[k]=true;if(k==='shield')w.ground=[{x:-1e6,y:w.GY,w:2e7,h:400}];}
  snd('win');burst(w,bx,by,['#ffc83d','#7ad7f0','#ff7ab8','#9be37a'],28,220);
  say(w,`Lucky prize: ${POWERS[k].icon} ${k==='blocks'?'+3 blocks!':POWERS[k].name+' for this round!'}`,3000);hud(w);
}
function resume(w){if(w.mode==='done'||w.mode==='win')return;w.mode='play';w.ctl.jumpQ=0;hud(w);playPanel(w);}
function wallTurn(w,o){
  if(w.blocks>=3){
    showActions(w,'A big wall!',`You have ${w.blocks} blocks. Stairs take 3.`,[{label:'🧱 Build stairs!',sub:'Uses 3 blocks. Then climb up yourself!',go:async()=>{await buildSteps(w,o,[[o.x-2*B,1],[o.x-B,2]],3);o.built=true;say(w,'Now climb the stairs and jump! ⬆️');resume(w);}},
      {label:'↩️ Not yet',sub:'Walk back and explore',go:()=>{w.p.x=o.x-PW-30;resume(w);}}]);
  }else{
    say(w,'A big wall! You need 3 blocks.');
    ask(w,()=>wallTurn(w,o),`A big wall! Stairs need 3 blocks. You have ${w.blocks}. Answer to earn more!`);
  }
}
function bossTurn(w,o){
  const can=w.blocks>=6;
  showActions(w,`${o.final?'👑':'👾'} ${bossName(w,o)} is in the way!`,`It has ${o.hp} ${o.hp===1?'heart':'hearts'}. Your ${SWORDS[w.swordPow].name} takes ${w.swordPow} ${w.swordPow===1?'heart':'hearts'} per hit. You have ${w.blocks} blocks.`,[
    {label:'⚔️ Sword',sub:'Answer right to get your sword and swing!',cls:'sword',go:()=>ask(w,async()=>{w.hasSword=true;hud(w);await swing(w,o);if(o.hp<=0){await defeat(w,o);resume(w);}else bossTurn(w,o);},'Answer right to swing your sword! ⚔️')},
    {label:'🧱 Build up and over',sub:can?'Uses 6 blocks. Climb up and jump over!':`Needs 6 blocks. You have ${w.blocks}.`,disabled:!can,go:async()=>{await buildSteps(w,o,[[o.x-3*B,1],[o.x-2*B,2],[o.x-B,3]],4);o.escaped=true;w.bossesEscaped++;say(w,`${bossName(w,o)}: "Hey! Get off my head!" 😤`,3000);resume(w);}}
  ]);
}
async function buildSteps(w,o,list,back){
  w.mode='anim';w.panel.innerHTML=`<h2>🧱 Building…</h2>`;
  w.p.x=o.x-back*B-PW-6;w.p.y=w.GY-PH;w.p.vy=0;w.p.vx=0;w.p.face=1;
  for(const [x,rows] of list){for(let r=0;r<rows;r++){w.placed.push({x,row:r,drop:220+r*30});w.blocks--;hud(w);snd('build');await wait(160);}}
  await wait(250);
}
async function swing(w,o){
  w.mode='anim';w.panel.innerHTML=`<h2>⚔️ Swing!</h2>`;snd('swish');
  await tween(w,.3,k=>{w.swordAng=-2.2+2.9*k;});
  w.slash={k:0,from:w.p.x+PW,to:o.x+B};
  await tween(w,.3,k=>{w.slash.k=k;});
  w.slash=null;o.hp=Math.max(0,o.hp-w.swordPow);o.flash=.45;w.shake=.25;snd('pop');
  burst(w,o.x+B,w.GY-2*B,['#fff',w.th.boss[1],'#ffc83d'],10+w.swordPow*6,220);
  await tween(w,.25,k=>{w.swordAng=.7-1.6*k;});
  if(o.hp>0)say(w,o.hp===1?'One more hit!':`Great swing! ${o.hp} hearts left.`);
}
async function defeat(w,o){
  await wait(250);
  burst(w,o.x+B,w.GY-1.5*B,[w.th.boss[0],w.th.boss[1],'#fff','#ffc83d'],40,380);snd('win');w.shake=.4;
  o.gone=true;w.bossesBeaten++;say(w,o.name==='The Color Thief'?'You beat The Color Thief and got the colors back! 🌈🎉':`You beat ${bossName(w,o)}! 🎉`,3000);
  await wait(700);
}
function showActions(w,title,text,acts){
  w.keyHandler=null;
  w.panel.innerHTML=`<h2>${esc(title)}</h2>${text?`<p>${esc(text)}</p>`:''}<div class="actions">${acts.map((a,i)=>`<button class="act ${a.cls||''}" data-i="${i}" ${a.disabled?'disabled':''}><b>${a.label}</b><span>${esc(a.sub||'')}</span></button>`).join('')}</div>`;
  const btns=[...w.panel.querySelectorAll('.act')];
  btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.disabled=true);acts[+b.dataset.i].go();});
  const keys=(w.cfg.keys||{}).answers||[];
  w.keyHandler=k=>{const i=keys.indexOf(k);if(i>=0&&btns[i]&&!btns[i].disabled)btns[i].click();};
}
function ask(w,onCorrect,intro){
  const pl=cur(w);const p=game&&game.wp?wordProblem(pl.level,game.wp,w.cfg.pup):pl.word?wordProblem(pl.level,pl.wtier||autoTier(pl),w.cfg.pup):adaptiveProblem(pl);w.lastProb=p.text;let wrongs=0,done=false,firstDone=false;const t0=performance.now();
  const keys=(w.cfg.keys||{}).answers||[];
  w.panel.innerHTML=`
    <div class="turn ${pl.level}">${esc(pl.name)}'s turn · ${p.word?'📖 ':''}${LEVELS[pl.level].icon} ${p.skillName?esc(p.skillName):LEVELS[pl.level].name}${p.tag?` · ${p.tag}`:''}</div>

function teamWin(w){
  const team=w.players.reduce((n,p)=>n+p.right,0);
  const n=w.players.length,share=Math.floor(w.coinsN/n);let extra=w.coinsN-share*n;
  [...w.players].sort((a,b)=>prof(a.name).coins-prof(b.name).coins).forEach(p=>{p.earned=share+(extra>0?1:0);extra--;prof(p.name).coins+=p.earned;});
  save();
  w.panel.innerHTML=`<h2>🏆 You did it, team! ${esc(w.cfg.pup)} made it home!</h2>
  <p>You found <b>${w.coinsN} coins</b>${n>1?' and split them evenly':''}. Spend them in the 🛍️ Shop!</p>

}

const padPrev={};
function padsList(){try{return [...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean).sort((a,b)=>a.index-b.index);}catch(e){return[];}}
function pollPads(){
  const pads=padsList();if(!pads.length)return;
  const active=worlds.filter(w=>!w.cfg.preview);
  pads.forEach((pad,i)=>{
    const prev=padPrev[pad.index]||{};
    const btn=n=>!!(pad.buttons[n]&&pad.buttons[n].pressed);
    const ax=pad.axes[0]||0,ay=pad.axes[1]||0;
    const now={left:btn(14)||ax<-.5,right:btn(15)||ax>.5,up:btn(12)||ay<-.5,down:btn(13)||ay>.5,face:btn(0)||btn(1)||btn(2)||btn(3),start:btn(9)||btn(8)};
    const edge=k=>now[k]&&!prev[k];
    padPrev[pad.index]=now;
    if(edge('start')){const b=document.querySelector('#go')||document.querySelector('[data-end="next"]');if(b){b.click();return;}}
    if(!active.length){ // menu: face button starts too
      if(edge('face')){const b=document.querySelector('#go');if(b)b.click();}
      return;
    }
    const w=game&&game.mode==='vs'?active[i]:active[0];
    if(!w)return;
    if(w.mode==='play'){w.pad={left:now.left,right:now.right};if(edge('face')||edge('up'))w.ctl.jumpQ=.15;return;}
    w.pad=null;
    const scope=(w.mode==='win'||w.mode==='done')&&game.mode==='vs'?$('result'):w.panel;
    const items=[...scope.querySelectorAll('.ans:not(:disabled),.act:not(:disabled),[data-end]')];
    if(!items.length)return;
    if(w.gpI==null||w.gpI>=items.length)w.gpI=0;
    if(edge('left')||edge('up'))w.gpI=(w.gpI-1+items.length)%items.length;
    if(edge('right')||edge('down'))w.gpI=(w.gpI+1)%items.length;
    items.forEach((el,j)=>el.classList.toggle('gp-focus',j===w.gpI));
    if(edge('face')){const el=items[w.gpI];w.gpI=0;el.click();}
  });
}

function playTone(f,t,d,type,vol){const a=ac();const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+d+.03);}
function musicTick(){
  const a=ac();const tune=TUNES[musicKey];const mel=tune.mel.split(' '),bass=tune.bass.split(' ');const e=60/tune.bpm/2;
  if(musicNext<a.currentTime)musicNext=a.currentTime+.05;
  while(musicNext<a.currentTime+.15){
    const m=freq(mel[musicStep%mel.length]);if(m)playTone(m,musicNext,e*.9,tune.lead,.5);
    if(musicStep%2===0){const b=freq(bass[(musicStep/2)%bass.length]);if(b)playTone(b,musicNext,e*1.8,'triangle',.8);}
    if(musicStep%4===2)playTone(3200,musicNext,.03,'square',.08);
    musicNext+=e;musicStep++;
  }
}

}

function prof(name){const k=(name||'').trim().toLowerCase()||'player';let p=saved.profiles[k];if(!p)p=saved.profiles[k]={coins:0,owned:{},look:{animal:'dog',skin:'orange'},sword:1,power:{speed:0,magnet:0,blocks:0,shield:0}};p.paints=p.paints||{};p.designs=p.designs||{};return p;}
function fullLook(pr){const a=pr.look.animal;pr.designs[a]=pr.designs[a]||{};return {animal:a,skin:pr.look.skin,design:pr.designs[a]};}
function subHint(a,b){
  const steps=[a];let v=a;const t=Math.floor(b/10)*10,o=b%10;
  for(let i=0;i<t/10&&steps.length<12;i++){v-=10;steps.push(v);}
  let txt=`Take away the tens first: ${steps.join(' → ')}`;
  if(o){const s2=[];for(let i=0;i<o;i++){v--;s2.push(v);}txt+=`. Then count back ${o}: ${s2.join(', ')}`;}
  return txt+'.';
}

const TRICKS={lava:[['pit','🔥','Lava pit']],castle:[['mpit','🏰','Moat + platform']],pirate:[['mpit','🛶','Water + raft']],city:[['mpit','🛗','Gap + lift']],
  jungle:[['jpit','🍄','River + mushroom']],toy:[['jpit','🤸','Gap + trampoline']],dino:[['jpit','🌋','Tar + geyser']],cloud:[['cpit','☁️','Gap + bouncy cloud']],
  rainbow:[['spit','⭐','Star bridge'],['kpit','🎨','Color blocks'],['slide','🌈','Rainbow slide']],robot:[['belt','🏭','Conveyor belt']],bee:[['honey','🍯','Sticky honey']],dungeon:[['crpit','💥','Crumbly bridge']],kitty:[['jpit','🛏️','Gap + cushion']],waterpark:[['slide','🛝','Water slide'],['mpit','🛟','Pool + inner tube'],['jpit','⛲','Pool + water jet']],funpark:[['mpit','🎢','Gap + coaster cart'],['slide','🎠','Parade path']]};
const pieceInfo=(t,th)=>[...BASE_PIECES,...(TRICKS[th]||[])].find(p=>p[0]===t)||['?','❔','?'];
function piecesToItems(pieces){let x=520;const items=[];for(const t of pieces){items.push({t,x});x+=(FOOT[t]||B)+240;}return {items,length:x+160};}
function maker(edit){
  worlds=[];shopPreview=null;$('result').hidden=true;$('homeBtn').hidden=false;

  if(edit){ed={id:edit.id,name:edit.name,theme:edit.theme};if(edit.items){ed.items=edit.items.map(o=>({...o}));ed.length=edit.length;}else{const c=piecesToItems(edit.pieces||[]);ed.items=c.items;ed.length=c.length;}}
  else{ed={id:null,name:'',theme:st.theme||'meadow',...piecesToItems(['rock','q','wall','coins','boss'])};}
  musicTheme(ed.theme);
  let tool='rock',cam=0,delArm=null,msg='',msgGood=false,ew=null;
  const app=$('app');app.innerHTML='';app.className='setup';
  const mapBox=document.createElement('div');mapBox.className='world';app.appendChild(mapBox);
  const panel=document.createElement('section');panel.className='panel';app.appendChild(panel);
  const minLen=()=>Math.max(1400,...ed.items.map(it=>it.x+(FOOT[it.t]||B)+240));
  const maxCam=()=>Math.max(0,ed.length+260-960);
  const rebuild=()=>{
    const course=makeCourse(ed.theme,null,{items:ed.items,length:ed.length});
    ew=createWorld({themeKey:ed.theme,course,preview:true,pup:'',players:[]});ew.mode='edit';ew.cam=cam;ew.edItems=ed.items;
    mapBox.innerHTML='';mapBox.appendChild(ew.root);worlds=[ew];
    const cv=ew.root.querySelector('canvas');cv.style.cursor='crosshair';cv.style.touchAction='none';
    let down=null;
    cv.addEventListener('pointerdown',e=>{down={x:e.clientX,cam,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
    cv.addEventListener('pointermove',e=>{if(!down)return;const r=cv.getBoundingClientRect();const dx=(e.clientX-down.x)*(960/r.width);if(Math.abs(dx)>8)down.moved=true;if(down.moved){cam=Math.max(0,Math.min(maxCam(),down.cam-dx));ew.cam=cam;syncScroll();}});
    cv.addEventListener('pointerup',e=>{if(!down)return;const wasDrag=down.moved;down=null;if(wasDrag)return;const r=cv.getBoundingClientRect();const wx=cam+(e.clientX-r.left)/r.width*960;tapAt(wx);});
  };
  const hitItem=wx=>ed.items.findIndex(it=>wx>=it.x&&wx<=it.x+(FOOT[it.t]||B));
  const tapAt=wx=>{
    if(tool==='erase'){const i=hitItem(wx);if(i>=0){ed.items.splice(i,1);snd('pop');msg='';}else{msg='Tap right on a piece to erase it.';msgGood=false;}rebuild();renderInfo();return;}
    const fw=FOOT[tool]||B;let x=Math.round((wx-fw/2)/B)*B;x=Math.max(400,x);
    if(ed.items.some(it=>x<it.x+(FOOT[it.t]||B)&&x+fw>it.x)){msg='No room there! Try a different spot.';msgGood=false;snd('buzz');renderInfo();return;}
    ed.items.push({t:tool,x});snd('build');msg='';
    if(x+fw+240>ed.length)ed.length=x+fw+240;
    rebuild();renderInfo();
  };
  let syncScroll=()=>{};
  const renderInfo=()=>{const c=$('mkCount');if(c)c.textContent=`${ed.items.length} pieces · length ${Math.round(ed.length/B)} steps`;const m=$('mkErr');if(m){m.innerHTML=msg?`<span style="color:${msgGood?'var(--good)':'var(--bad)'}">${msg}</span>`:'';}const sc=$('mkScroll');if(sc){sc.max=maxCam();sc.value=cam;}};
  const render=()=>{
    const palette=[...BASE_PIECES,...(TRICKS[ed.theme]||[])];
    panel.innerHTML=`
      <div class="row" style="justify-content:space-between"><h2>🛠️ Level Maker</h2><button class="big alt" id="mkBack">◀ Back</button></div>
      <p class="muted">1. Tap a piece button. 2. Tap the map where you want it. Drag the map (or use the slider) to scroll. Use 🧽 Eraser to remove things.</p>
      <div class="mkpal">${palette.map(([t,i,n])=>`<button data-tool="${t}" aria-pressed="${tool===t}"><span>${i}</span>${n}</button>`).join('')}<button data-tool="erase" aria-pressed="${tool==='erase'}"><span>🧽</span>Eraser</button></div>
      <div class="row"><button class="big alt" id="mkLeft" style="font-size:1.1rem">◀</button><input type="range" id="mkScroll" min="0" max="${maxCam()}" value="${cam}" step="10" style="flex:1;min-width:140px" aria-label="Scroll the map"><button class="big alt" id="mkRight" style="font-size:1.1rem">▶</button></div>
      <div class="row"><span class="lbl">📏 Length</span><button class="big alt" id="mkShorter" style="font-size:1.1rem">➖ Shorter</button><button class="big alt" id="mkLonger" style="font-size:1.1rem">➕ Longer</button><span class="muted" id="mkCount"></span></div>
      <div><label class="lbl" for="lvName">Level name</label><br><input class="text" id="lvName" maxlength="24" placeholder="Like: Super Tricky Jungle" value="${esc(ed.name)}"></div>
      <div class="lbl">World</div>
      <div class="seg">${ORDER.map(k=>`<button data-mk="${k}" aria-pressed="${ed.theme===k}">${THEMES[k].icon} ${THEMES[k].name}</button>`).join('')}</div>
      <div class="err" id="mkErr"></div>
      <div class="row"><button class="big" id="mkPlay">▶ Play it!</button><button class="big alt" id="mkSave">💾 Save to my levels</button><button class="big alt" id="mkNew">➕ New level</button></div>
      ${st.levels.length?`<h3>💾 My levels</h3><div class="shopgrid">${st.levels.map(l=>`<div class="item"><div class="ic">${THEMES[l.theme]?THEMES[l.theme].icon:'🌍'}</div><b>${esc(l.name)}</b><div class="muted">${THEMES[l.theme]?THEMES[l.theme].name:''} · ${(l.items||l.pieces||[]).length} pieces</div><div class="row"><button data-lplay="${l.id}">▶ Play</button><button data-ledit="${l.id}">✏️ Edit</button><button data-ldel="${l.id}" style="background:#fff;border-color:var(--bad)">${delArm===l.id?'Tap again':'🗑️'}</button></div></div>`).join('')}</div>`:''}`;
    const keepName=()=>{ed.name=$('lvName').value;};
    syncScroll=()=>{const sc=$('mkScroll');if(sc){sc.max=maxCam();sc.value=cam;}};
    $('mkBack').onclick=()=>menu();
    panel.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;panel.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
    $('mkScroll').oninput=e=>{cam=+e.target.value;if(ew)ew.cam=cam;};
    $('mkLeft').onclick=()=>{cam=Math.max(0,cam-480);ew.cam=cam;syncScroll();};
    $('mkRight').onclick=()=>{cam=Math.min(maxCam(),cam+480);ew.cam=cam;syncScroll();};
    $('mkLonger').onclick=()=>{ed.length+=20*B;rebuild();renderInfo();cam=maxCam();ew.cam=cam;syncScroll();};
    $('mkShorter').onclick=()=>{const nl=Math.max(minLen(),ed.length-20*B);if(nl===ed.length){msg='Erase pieces at the end to make it shorter.';msgGood=false;}ed.length=nl;cam=Math.min(cam,maxCam());rebuild();renderInfo();};
    panel.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{keepName();ed.theme=b.dataset.mk;const ok=new Set([...BASE_PIECES,...(TRICKS[ed.theme]||[])].map(p=>p[0]));ed.items=ed.items.filter(it=>ok.has(it.t));if(!ok.has(tool))tool='rock';musicTheme(ed.theme);msg='';rebuild();render();});
    const check=()=>{keepName();if(!ed.items.length){msg='Put some pieces on the map first!';msgGood=false;renderInfo();return false;}if(!ed.items.some(it=>['wall','boss','q','spit'].includes(it.t))){msg='Add at least one 🧱 wall, 👾 boss, or ❓ lucky block so there is math to do!';msgGood=false;renderInfo();return false;}if(!ed.name.trim())ed.name='My Level';return true;};
    const doSave=()=>{if(!ed.id)ed.id='L'+Date.now();const i=st.levels.findIndex(l=>l.id===ed.id);const rec={id:ed.id,name:ed.name.trim(),theme:ed.theme,items:ed.items.map(o=>({...o})),length:ed.length};if(i>=0)st.levels[i]=rec;else st.levels.push(rec);save();};
    $('mkSave').onclick=()=>{if(!check())return;doSave();snd('win');msg='💾 Saved to My levels!';msgGood=true;render();};
    $('mkPlay').onclick=()=>{if(!check())return;doSave();playLevel(st.levels.find(l=>l.id===ed.id));};
    $('mkNew').onclick=()=>maker();
    panel.querySelectorAll('[data-lplay]').forEach(b=>b.onclick=()=>playLevel(st.levels.find(l=>l.id===b.dataset.lplay)));
    panel.querySelectorAll('[data-ledit]').forEach(b=>b.onclick=()=>maker(st.levels.find(l=>l.id===b.dataset.ledit)));
    panel.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=()=>{const id=b.dataset.ldel;if(delArm!==id){delArm=id;render();return;}st.levels=st.levels.filter(l=>l.id!==id);if(ed.id===id)ed.id=null;delArm=null;save();render();});
    renderInfo();
  };
  rebuild();render();
}
function playLevel(l){if(!l)return;game={mode:saved.mode||'team',theme:l.theme,wp:0,custom:l.items?{name:l.name,id:l.id,items:l.items.map(o=>({...o})),length:l.length}:{name:l.name,pieces:[...l.pieces],id:l.id}};startGame();}
function takePowers(p){const pr=prof(p.name);const pw={};for(const k of Object.keys(p.use||{})){if(!p.use[k])continue;if(pr.power[k]>0){pr.power[k]--;pw[k]=true;}else p.use[k]=false;}return pw;}
function startGame(){
  const st=saved;$('result').hidden=true;$('homeBtn').hidden=false;shopPreview=null;
  const app=$('app');app.innerHTML='';app.className='worlds'+(game.mode==='vs'?' vs':'');
  const course=makeCourse(game.theme,game.custom&&game.custom.pieces,game.custom&&game.custom.items?{items:game.custom.items,length:game.custom.length}:null);musicTheme(game.theme);
  if(game.mode==='team'){
    const act=st.players.filter(p=>p.on);
    const players=act.map(p=>({name:p.name,level:p.level,word:!!p.word,wtier:p.wtier||0,right:0,tries:0}));
    const pw={};act.forEach(p=>Object.assign(pw,takePowers(p)));
    const lookP=st.players[st.teamLook||0];
    const look=fullLook(prof((lookP&&lookP.on?lookP:act[0]).name));
    const swordPow=Math.max(...act.map(p=>prof(p.name).sword));
    const w=createWorld({themeKey:game.theme,course:clone(course),players,pup:(st.pup||'').trim()||(look.animal==='cat'?'Kitty':'Puppy'),collar:'#1fae6a',keys:KEYS.team,pw,look,swordPow});
    worlds=[w];app.appendChild(w.root);say(w,game.custom?`🛠️ ${game.custom.name}! Go, ${w.cfg.pup}!`:game.wp?`📖 Word Problem Level ${game.wp}! Go, ${w.cfg.pup}!`:`${THEMES[game.theme].icon} ${THEMES[game.theme].name}! Go, ${w.cfg.pup}!`);
  }else{
    worlds=st.players.map((p,i)=>{
      const pr=prof(p.name);
      const w=createWorld({themeKey:game.theme,course:clone(course),players:[{name:p.name,level:p.level,word:!!p.word,wtier:p.wtier||0,right:0,tries:0}],pup:(p.pup||'').trim()||`${p.name}'s ${pr.look.animal==='cat'?'cat':'puppy'}`,collar:i?'#1f8fe0':'#1fae6a',keys:i?KEYS.p2:KEYS.p1,versus:true,label:`P${i+1}: ${p.name}`,pw:takePowers(p),look:fullLook(pr),swordPow:pr.sword});
      app.appendChild(w.root);return w;
    });
    worlds.forEach(w=>{w.mode='wait';});
    let n=3;const tick=()=>{worlds.forEach(w=>say(w,n>0?`Ready… ${n}`:'GO! 🏁',n>0?0:1500));snd(n>0?'bump':'win');if(n>0){n--;setTimeout(tick,800);}else worlds.forEach(w=>{w.mode='play';});};tick();
  }
  save();worlds.forEach(hud);
}

// ---------- grown-ups dashboard ----------
function parentGate(){
  worlds=[];shopPreview=null;$('result').hidden=true;$('homeBtn').hidden=false;
  const app=$('app');app.innerHTML='';app.className='setup';
  const panel=document.createElement('section');panel.className='panel';app.appendChild(panel);
  panel.innerHTML=`<div class="row" style="justify-content:space-between"><h2>📊 For grown-ups</h2><button class="big alt" id="pgBack">◀ Back</button></div>
    <p>This page shows each player's math progress. To open it, <b>press and hold</b> the button for 3 seconds.</p>
    <button class="big holdbtn" id="holdBtn"><span id="holdFill"></span><i>Press and hold</i></button>`;
  $('pgBack').onclick=()=>menu();
  const hb=$('holdBtn'),fill=$('holdFill');let tm=null,st0=0,raf=0;
  const step=()=>{const k=Math.min(1,(performance.now()-st0)/3000);fill.style.width=(k*100)+'%';if(k>=1){cancel();dashboard();return;}raf=requestAnimationFrame(step);};
  const start=e=>{e.preventDefault();st0=performance.now();raf=requestAnimationFrame(step);};
  const cancel=()=>{cancelAnimationFrame(raf);fill.style.width='0%';};
  hb.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>hb.addEventListener(ev,cancel));hb.addEventListener('contextmenu',e=>e.preventDefault());
}
function dashboard(){
  worlds=[];const app=$('app');app.innerHTML='';app.className='setup';
  const panel=document.createElement('section');panel.className='panel';app.appendChild(panel);
  const resetArm={};
  const render=()=>{
    const names=[];(saved.players||[]).forEach(p=>{const k=(p.name||'').trim().toLowerCase();if(k&&!names.includes(k))names.push(k);});
    Object.keys(saved.profiles||{}).forEach(k=>{const pr=saved.profiles[k];if(pr.stats&&pr.stats.n&&!names.includes(k))names.push(k);});
    const card=k=>{
      const pr=saved.profiles[k]||prof(k);const disp=((saved.players||[]).find(p=>(p.name||'').trim().toLowerCase()===k)||{}).name||k;
      const mainLv=((saved.players||[]).find(p=>(p.name||'').trim().toLowerCase()===k)||{}).level;
      mast(pr,'l1');mast(pr,'l2');const S=pr.stats;
      const acc=S.n?Math.round(S.first/S.n*100):null;const avg=S.tn?(S.tsum/S.tn).toFixed(1):null;
      const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;days.push({key,lab:d.toLocaleDateString(undefined,{weekday:'short'}),n:pr.daily[key]||0});}
      const mx=Math.max(5,...days.map(x=>x.n));
      const track=lv=>{const M=pr.mastery[lv];const L=SKILLS[lv];const has=Object.keys(M.sk).length>0;if(!has&&mainLv!==lv)return '';
        return `<div class="track"><h3>${LEVELS[lv].icon} ${LEVELS[lv].name}</h3>
          <div class="ladder">${L.map((sk,i)=>{const d=M.sk[sk.id]||{h:[],t:[],n:0};const r=d.h.slice(-10);const c=r.reduce((a,b)=>a+b,0);const med=median(d.t);
            const st=i<M.cur?'✅':i===M.cur?'🎯':'⬜';const pct=r.length?c/r.length:0;
            return `<div class="rung ${i===M.cur?'now':''} ${i<M.cur?'done':''}"><span class="ri">${st}</span><span class="rn">${i+1}. ${esc(sk.name)}</span>
              <span class="rb" title="${r.length?`${c} of last ${r.length} right on the first try`:'Not tried yet'}"><i style="width:${Math.round(pct*100)}%"></i></span>
              <span class="rs">${r.length?`${c}/${r.length}`:'–'}</span><span class="rt" title="Median answer time (goal ${sk.t}s)">${med!=null?`${med}s`:'–'} <small>/ ${sk.t}s</small></span><span class="rc">${d.n||0} tries</span></div>`;}).join('')}</div>
          <div class="row ctl"><label>Current skill <select data-setcur="${k}:${lv}">${L.map((sk,i)=>`<option value="${i}" ${i===M.cur?'selected':''}>${i+1}. ${esc(sk.name)}</option>`).join('')}</select></label>
          <label class="chk"><input type="checkbox" data-lock="${k}:${lv}" ${M.lock?'checked':''}> 🔒 Stay on this skill (no auto level-up)</label>
          <button class="resetbtn" data-reset="${k}:${lv}">${resetArm[k+lv]?'Tap again to reset':'Reset this track'}</button></div></div>`;};
      const tr=Object.entries(pr.trouble).sort((a,b)=>b[1].n-a[1].n||b[1].miss-a[1].miss);
      const active=tr.filter(([_,t])=>t.n>0).slice(0,10),fixed=tr.filter(([_,t])=>t.n<=0&&t.miss>0).slice(0,6);
      const fmt=t=>esc(t.p.text.replace(' = ?','').replace('?','□'))+(t.p.miss?'':' = ?');
      return `<div class="kid">
        <h2>${esc(disp)}</h2>
        <div class="stats">
          <div class="stat"><div class="muted">Problems answered</div><div class="n">${S.n}</div></div>
          <div class="stat"><div class="muted">Right on first try</div><div class="n">${acc==null?'–':acc+'%'}</div></div>
          <div class="stat"><div class="muted">Average answer time</div><div class="n">${avg==null?'–':avg+'s'}</div></div>
          <div class="stat"><div class="muted">Today</div><div class="n">${pr.daily[today()]||0}</div></div>
        </div>
        <div class="chartbox"><div class="lbl">Problems per day (last 7 days)</div>
          <div class="bars" role="img" aria-label="Problems per day: ${days.map(x=>`${x.lab} ${x.n}`).join(', ')}">${days.map(x=>`<div class="bcol" title="${x.lab}: ${x.n} problems"><span class="bv">${x.n}</span><div class="bar" style="height:${x.n?Math.max(3,Math.round(x.n/mx*100)):0}%"></div><span class="bl">${x.lab}</span></div>`).join('')}</div></div>
        ${track('l1')}${track('l2')}
        <div class="track"><h3>🧩 Trouble facts</h3>${active.length?`<div class="chips">${active.map(([_,t])=>`<span class="chip2 bad">${fmt(t)} <small>missed ${t.miss}×</small></span>`).join('')}</div><p class="muted">These come back more often until they're answered right.</p>`:'<p class="muted">No trouble facts right now. 🎉</p>'}
          ${fixed.length?`<div class="chips">${fixed.map(([_,t])=>`<span class="chip2 good">✓ ${fmt(t)}</span>`).join('')}</div>`:''}</div>
        ${pr.log.length?`<div class="track"><h3>📈 Recent level changes</h3><ul class="log">${pr.log.slice(-6).reverse().map(l=>`<li>${l.d}: ${l.up?'⬆️ Leveled up to':'⬇️ Stepped back to'} <b>${esc(l.to)}</b> (${LEVELS[l.lv].icon})</li>`).join('')}</ul></div>`:''}
      </div>`;
    };
    panel.innerHTML=`<div class="row" style="justify-content:space-between"><h2>📊 Math progress</h2><button class="big alt" id="dbBack">◀ Back to game</button></div>
      <p class="muted">A skill is mastered after 8 of the last 10 answers are right on the first try and the usual answer time is under the goal. Then the game moves up a rung by itself. If first-try accuracy drops under 50%, it steps back one rung. About 70% of problems come from the current skill, 20% review earlier skills, and 10% preview the next one. Progress is saved on this device only.</p>
      ${names.length?names.map(card).join(''):'<p>No players yet.</p>'}`;
    $('dbBack').onclick=()=>menu();
    panel.querySelectorAll('[data-setcur]').forEach(sl=>sl.onchange=()=>{const [k,lv]=sl.dataset.setcur.split(':');const M=mast(prof(k),lv);M.cur=+sl.value;save();render();});
    panel.querySelectorAll('[data-lock]').forEach(cb=>cb.onchange=()=>{const [k,lv]=cb.dataset.lock.split(':');mast(prof(k),lv).lock=cb.checked;save();render();});
    panel.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const [k,lv]=b.dataset.reset.split(':');if(!resetArm[k+lv]){resetArm[k+lv]=1;render();return;}const pr=prof(k);pr.mastery[lv]={cur:0,lock:false,sk:{}};Object.keys(pr.trouble||{}).forEach(f=>{if(pr.trouble[f].lv===lv)delete pr.trouble[f];});delete resetArm[k+lv];save();render();});
  };
  render();
}
$('parentBtn').onclick=()=>parentGate();
$('homeBtn').onclick=menu;
saved.wp=0;if(saved.mode)game={mode:saved.mode,theme:saved.theme||'meadow',wp:0};
menu();
})();
</script>
</body>
